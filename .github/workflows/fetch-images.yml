name: Fetch oracle bone images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_images.py
      - .github/workflows/fetch-images.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download images from Wikimedia Commons
        run: python scripts/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add oracle-bone/img
          git diff --cached --quiet || git commit -m "Update oracle bone images from Wikimedia Commons"
          git push
